name: Desktop Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.1

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --verbose
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: vnt2_app-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            ninja-build \
            pkg-config \
            file \
            wget
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Build Linux AppImage
        run: |
          chmod +x linux/build_linux_appimage.sh
          linux/build_linux_appimage.sh \
            build/linux/x64/release/bundle x86_64
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: vnt2_app-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: vnt2_app-linux-x86_64-appimage
          path: vnt2_app-linux-x86_64.AppImage
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Fix tun-rs macOS size_of import
        shell: bash
        run: |
          cargo fetch --manifest-path rust/Cargo.toml
          TUN_FILE=$(find "$HOME/.cargo/registry/src" \
            -path "*/tun-rs-2.8.8/src/platform/macos/tap/mod.rs" \
            -type f -print -quit)
          test -n "$TUN_FILE"
          if ! grep -q '^use std::mem::size_of;' "$TUN_FILE"; then
            sed -i '' '/use std::io;/a\
          use std::mem::size_of;' "$TUN_FILE"
          fi
      - name: Build macOS
        run: flutter build macos --release
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: vnt2_app-macos
          path: build/macos/Build/Products/Release/vnt2_app.app/
          if-no-files-found: error

